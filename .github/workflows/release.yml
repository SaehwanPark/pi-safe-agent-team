name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release-gates:
    name: Release gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out local-context-manager
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v4
        with:
          repository: SaehwanPark/pi-local-context-manager
          # Pin the RC gate to the exact LCM revision used for the audit.
          ref: b0ad3c108eb50a8c21ee087d2219ad9e28c30c73
          path: local-context-manager

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node -e "const actual=require('./package.json').version; const expected=process.env.RELEASE_VERSION.replace(/^v/, ''); if (actual !== expected) { console.error('package version ' + actual + ' does not match release ' + expected); process.exit(1); }"

      - name: Typecheck and test
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Run short broker chaos gate
        run: npm run bench:r9-chaos -- 20

      - name: Run production-default soak gate
        if: matrix.os == 'ubuntu-latest'
        run: npm run bench:r10-production-soak -- 250

      - name: Install local-context-manager dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: local-context-manager
        run: npm ci

      - name: Install Pi CLI
        if: matrix.os == 'ubuntu-latest'
        run: npm install --global @earendil-works/pi-coding-agent@0.85.1

      - name: Run Pi + local-context-manager smoke
        if: matrix.os == 'ubuntu-latest'
        env:
          LCM_DIR: ${{ github.workspace }}/local-context-manager
        run: npm run smoke:pi:with-lcm

      - name: Run installed tarball smoke
        if: matrix.os == 'ubuntu-latest'
        run: npm run smoke:package

  publish:
    needs: release-gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node -e "const actual=require('./package.json').version; const expected=process.env.RELEASE_VERSION.replace(/^v/, ''); if (actual !== expected) { console.error('package version ' + actual + ' does not match release ' + expected); process.exit(1); }"

      - name: Publish with npm trusted publishing
        run: npm publish --access public
